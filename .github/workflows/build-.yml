name: Compiler l'APK

# Se déclenche automatiquement à chaque envoi de code sur la branche main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" sur GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4

      - name: Installer Java (nécessaire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer les dossiers de plateforme manquants (android/)
        run: flutter create . --platforms=android

      - name: Forcer un compileSdk plus récent (requis par plusieurs dépendances)
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle || true

      - name: Installer les dépendances du projet
        run: flutter pub get

      - name: Compiler l'APK (version release)
        run: flutter build apk --release

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: ma-caisse-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
